<script>
let activeTab = 'universal';
let activeDomainFilter = 'all';

/* Editions, newest first. The active one is exposed as DATA so every
   render function below reads from a single edition at a time. */
const YEARS = Object.keys(DATASETS).sort().reverse();

/* Combined view across every edition. Paper ids are only unique within an
   edition (2025 and 2026 both start at P01), so they are namespaced here and
   every reference to them is rewritten to match. Rules, challenges and
   concerns that recur across editions are merged into a single entry whose
   paper list is the union of the originals. */
const ALL = 'all';

function combineEditions() {
  const papers = [];
  YEARS.slice().reverse().forEach(y => {
    DATASETS[y].accepted_papers.forEach(p => {
      papers.push(Object.assign({}, p, { id: y + '-' + p.id, displayId: p.id, edition: y }));
    });
  });

  /* Merge a list that exists on every edition, keyed by its text field. */
  function merge(pick, textKey) {
    const byText = new Map();
    YEARS.slice().reverse().forEach(y => {
      (pick(DATASETS[y]) || []).forEach(item => {
        const key = String(item[textKey]).trim().toLowerCase();
        if (!byText.has(key)) byText.set(key, Object.assign({}, item, { papers: [] }));
        const target = byText.get(key);
        (item.papers || []).forEach(pid => {
          const scoped = y + '-' + pid;
          if (!target.papers.includes(scoped)) target.papers.push(scoped);
        });
      });
    });
    return Array.from(byText.values());
  }

  return {
    title: 'RETRAI Paper Repository',
    subtitle: 'Workshop on Requirements Engineering for Trustworthy AI',
    event: 'All editions · ' + YEARS[YEARS.length - 1] + '–' + YEARS[0],
    year: ALL,
    accepted_papers: papers,
    requirements_for_trustworthy_ai: {
      universal:       merge(d => d.requirements_for_trustworthy_ai.universal, 'rule'),
      domain_specific: merge(d => d.requirements_for_trustworthy_ai.domain_specific, 'rule'),
      customizable:    merge(d => d.requirements_for_trustworthy_ai.customizable, 'rule'),
    },
    challenges_for_trustworthy_ai: {
      universal:       merge(d => d.challenges_for_trustworthy_ai.universal, 'challenge'),
      domain_specific: merge(d => d.challenges_for_trustworthy_ai.domain_specific, 'challenge'),
      customized:      merge(d => d.challenges_for_trustworthy_ai.customized, 'challenge'),
    },
    trustworthy_ai_concerns: merge(d => d.trustworthy_ai_concerns, 'concern'),
  };
}

/* Everything the UI can show: the combined view first, then the editions. */
const VIEWS = { [ALL]: combineEditions() };
YEARS.forEach(y => { VIEWS[y] = DATASETS[y]; });

const requested = location.hash.replace('#','');
let activeYear = VIEWS[requested] ? requested : ALL;
let DATA = VIEWS[activeYear];

function loadData() {
  const loader = document.getElementById('loading-indicator');
  if (loader) loader.remove();
  renderYearNav();
  renderEdition();
}

function renderEdition() {
  renderEditionHeader();
  renderTab(activeTab);
  renderStats(document.getElementById('stats-content'));
  renderStatsBreakdown('domain');
  wireStatsSubTabs();
}

function yearButton(key, label, extraClass) {
  return `
    <li>
      <button class="year-btn${extraClass ? ' ' + extraClass : ''}${key === activeYear ? ' active' : ''}"
              data-year="${key}" ${key === activeYear ? 'aria-current="true"' : ''}>
        <span class="year-btn-year">${label}</span>
      </button>
    </li>`;
}

function renderYearNav() {
  const nav = document.getElementById('year-nav');
  nav.innerHTML = yearButton(ALL, 'All editions', 'year-btn-all')
    + '<li class="year-nav-divider" aria-hidden="true"></li>'
    + YEARS.map(y => yearButton(y, y)).join('');

  nav.querySelectorAll('.year-btn').forEach(btn => {
    btn.addEventListener('click', () => setYear(btn.dataset.year));
  });
}

function setYear(year) {
  if (!VIEWS[year] || year === activeYear) return;
  activeYear = year;
  DATA = VIEWS[year];
  activeDomainFilter = 'all';
  history.replaceState(null, '', '#' + year);
  renderYearNav();
  renderEdition();
}

window.addEventListener('hashchange', () => {
  const y = location.hash.replace('#','');
  if (VIEWS[y]) setYear(y);
});

function isCombined() { return activeYear === ALL; }

function renderEditionHeader() {
  document.getElementById('edition-header').innerHTML = `
    <h2 class="edition-title">${isCombined() ? 'All Editions' : escHtml(String(DATA.year)) + ' Edition'}</h2>
    <p class="edition-meta">
      ${escHtml(DATA.event)}
      <span class="edition-sep">·</span>
      ${DATA.accepted_papers.length} papers
      <span class="edition-sep">·</span>
      ${DATA.requirements_for_trustworthy_ai.universal.length
        + DATA.requirements_for_trustworthy_ai.domain_specific.length
        + DATA.requirements_for_trustworthy_ai.customizable.length} requirements
    </p>`;
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.classList.remove('orange'); });
    btn.classList.add('active');
    if (btn.dataset.tab === 'stats') {
      btn.classList.add('orange');
      document.getElementById('stats-section').scrollIntoView({ behavior: 'smooth' });
      return;
    }
    activeTab = btn.dataset.tab;
    activeDomainFilter = 'all';
    renderTab(activeTab);
  });
});

function renderTab(tab) {
  const container = document.getElementById('tab-content');
  if (tab === 'universal')  renderUniversal(container);
  if (tab === 'domain')     renderDomain(container);
  if (tab === 'custom')     renderCustom(container);
}

function paperBadges(papers) {
  return `<div class="paper-badges">${papers.map(p => {
    const info = getPaperInfo(p);
    const authorsDisplay = info.authors.length === 1
      ? info.authors[0]
      : info.authors.length <= 3
        ? info.authors.join(', ')
        : info.authors[0] + ' et al.';
    const inner = `<span class="paper-badge-title">${escHtml(info.title)}</span>`
                + `<span class="paper-badge-authors">${escHtml(authorsDisplay)}</span>`;
    if (info.pdf) {
      return `<a class="paper-badge" href="${escHtml(encodeURI(info.pdf))}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
    }
    return `<span class="paper-badge">${inner}</span>`;
  }).join('')}</div>`;
}

function getPaperInfo(id) {
  const fallback = { title: id, authors: [], pdf: null };
  if (!DATA) return fallback;
  const p = DATA.accepted_papers.find(p => p.id === id);
  if (!p) return fallback;
  return { title: p.title, authors: p.authors || [], pdf: p.pdf || null };
}

function sectionLabel(text) {
  return `<div class="section-label">${text}</div>`;
}

function renderUniversal(container) {
  const req = DATA.requirements_for_trustworthy_ai.universal;
  container.innerHTML = `
    ${sectionLabel('Requirements for Trustworthy AI')}
    <h3 class="sub-heading">Universal Requirements <span class="badge">${req.length} rules</span></h3>
    <p class="tab-desc">
      Rules applicable to <strong>any AI system</strong>, regardless of domain or deployment context.
      These rules set the baseline for trustworthy AI across the board.
    </p>
    <table class="rules-table">
      <thead><tr>
        <th style="width:68%">Rule (SHALL / MUST)</th>
        <th style="width:4%;text-align:center">#</th>
        <th>Paper(s)</th>
      </tr></thead>
      <tbody>
        ${req.map(r => `
          <tr>
            <td class="rule-text">${escHtml(r.rule)}</td>
            <td class="paper-count-cell">${r.papers.length}</td>
            <td>${paperBadges(r.papers)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function renderDomain(container) {
  const req = DATA.requirements_for_trustworthy_ai.domain_specific;
  const domains = ['all', ...new Set(req.map(r => r.domain))];
  const filtered = activeDomainFilter === 'all' ? req : req.filter(r => r.domain === activeDomainFilter);

  container.innerHTML = `
    ${sectionLabel('Requirements for Trustworthy AI')}
    <h3 class="sub-heading">Domain-Specific Requirements <span class="badge">${req.length} rules</span></h3>
    <p class="tab-desc">
      Rules that apply within a <strong>specific application domain</strong>.
      Use the filters below to focus on a particular area.
    </p>
    <div class="domain-filters" id="domain-filters">
      ${domains.map(d => `
        <button class="filter-pill${d === activeDomainFilter ? ' active' : ''}" data-domain="${d}">
          ${d === 'all' ? 'All Domains' : d}
        </button>`).join('')}
    </div>
    <table class="rules-table">
      <thead><tr>
        <th style="width:53%">Rule (SHALL / MUST)</th>
        <th style="width:16%">Domain</th>
        <th style="width:4%;text-align:center">#</th>
        <th>Paper(s)</th>
      </tr></thead>
      <tbody id="domain-tbody">
        ${filtered.length === 0 ? `<tr><td colspan="4" class="empty-state">No rules for this domain.</td></tr>` :
          filtered.map(r => `
            <tr>
              <td class="rule-text">${escHtml(r.rule)}</td>
              <td><span class="domain-chip">${escHtml(r.domain)}</span></td>
              <td class="paper-count-cell">${r.papers.length}</td>
              <td>${paperBadges(r.papers)}</td>
            </tr>`).join('')}
      </tbody>
    </table>

    <h3 class="sub-heading" style="margin-top:2.5rem">Domain-Specific Challenges
      <span class="badge orange">${DATA.challenges_for_trustworthy_ai.domain_specific.length} challenges</span>
    </h3>
    <table class="rules-table">
      <thead><tr>
        <th style="width:53%">Challenge</th>
        <th style="width:16%">Domain</th>
        <th style="width:4%;text-align:center">#</th>
        <th>Paper(s)</th>
      </tr></thead>
      <tbody>
        ${DATA.challenges_for_trustworthy_ai.domain_specific.length === 0
          ? `<tr><td colspan="4" class="empty-state">No domain-specific challenges recorded for this edition.</td></tr>`
          : DATA.challenges_for_trustworthy_ai.domain_specific.map(r => `
          <tr>
            <td class="rule-text">${escHtml(r.challenge)}</td>
            <td><span class="domain-chip">${escHtml(r.domain)}</span></td>
            <td class="paper-count-cell">${r.papers.length}</td>
            <td>${paperBadges(r.papers)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  container.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      activeDomainFilter = pill.dataset.domain;
      renderDomain(container);
    });
  });
}

  const req  = DATA.requirements_for_trustworthy_ai.customizable;
  const chal = DATA.challenges_for_trustworthy_ai.customized;

  container.innerHTML = `
    ${sectionLabel('Requirements for Trustworthy AI')}

    <p class="tab-desc">
      Rules configurable to an <strong>individual user's profile</strong>, preferences,

    </p>
    <table class="rules-table">
      <thead><tr>
        <th style="width:68%">Rule (SHALL / MUST)</th>
        <th style="width:4%;text-align:center">#</th>
        <th>Paper(s)</th>
      </tr></thead>
      <tbody>
        ${req.map(r => `
          <tr>
            <td class="rule-text">${escHtml(r.rule)}</td>
            <td class="paper-count-cell">${r.papers.length}</td>
            <td>${paperBadges(r.papers)}</td>
          </tr>`).join('')}
      </tbody>
    </table>

    <h3 class="sub-heading" style="margin-top:2.5rem">Customized Challenges
      <span class="badge orange">${chal.length} challenges</span>
    </h3>
    <table class="rules-table">
      <thead><tr>
        <th style="width:68%">Challenge</th>
        <th style="width:4%;text-align:center">#</th>
        <th>Paper(s)</th>
      </tr></thead>
      <tbody>
        ${chal.length === 0
          ? `<tr><td colspan="3" class="empty-state">No customized challenges recorded for this edition.</td></tr>`
          : chal.map(r => `
          <tr>
            <td class="rule-text">${escHtml(r.challenge)}</td>
            <td class="paper-count-cell">${r.papers.length}</td>

          </tr>`).join('')}
      </tbody>
    </table>

    <h3 class="sub-heading" style="margin-top:2.5rem">Trustworthy AI Concerns
      <span class="badge teal">${DATA.trustworthy_ai_concerns.length} concerns</span>
    </h3>
    <p class="tab-desc">Cross-cutting concerns mapped to EU AI HLEG and ISO/IEC 42001 pillars.</p>
    <div class="concerns-grid">
      ${DATA.trustworthy_ai_concerns.map(c => `
        <div class="concern-card">
          <div class="concern-name">${escHtml(c.concern)}</div>
          <div class="concern-desc">${escHtml(c.description)}</div>
          ${paperBadges(c.papers)}
        </div>`).join('')}
    </div>`;
}

/* Attendance figures live in each edition's "stats" block; cards for
   figures an edition has not published yet are simply left out. The
   repository count is always derived from the data itself. */
function statCards() {
  /* Across all editions, a figure is only shown when every edition reports
     it — a partial sum labelled as a total would misrepresent the series. */
  if (isCombined()) {
    const totalIfComplete = key => {
      const values = YEARS.map(y => (DATASETS[y].stats || {})[key]);
      return values.every(v => typeof v === 'number')
        ? values.reduce((a, b) => a + b, 0)
        : undefined;
    };
    return [
      { label: 'Editions',      value: YEARS.length },
      { label: 'Submissions',   value: totalIfComplete('submissions') },
      { label: 'In Workshop',   value: totalIfComplete('in_workshop') },
      { label: 'Registrations', value: totalIfComplete('registrations') },
      { label: 'In Repository', value: DATA.accepted_papers.length },
    ].filter(c => c.value !== undefined && c.value !== null);
  }

  const s = DATA.stats || {};
  return [
    { label: 'Submissions',   value: s.submissions },
    { label: 'In Workshop',   value: s.in_workshop },
    { label: 'Registrations', value: s.registrations },
    { label: 'In Repository', value: DATA.accepted_papers.length },
  ].filter(c => c.value !== undefined && c.value !== null);
}

function renderStatsBreakdown(view) {
  const el = document.getElementById('stats-breakdown');
  if (!el) return;

  const dotColors = ['#41644A','#E9762B','#2980b9','#8e44ad','#c0392b','#16a085','#d35400','#27ae60'];

  if (view === 'domain') {
    const domainCounts = {};
    DATA.accepted_papers.forEach(p => {
      const d = p.domain.split('/')[0].trim();
      domainCounts[d] = (domainCounts[d] || 0) + 1;
    });
    const maxCount = Math.max(...Object.values(domainCounts));
    el.innerHTML = `<div class="breakdown-grid">
      ${Object.entries(domainCounts).sort((a,b) => b[1]-a[1]).map(([d, n], i) => `
        <div class="breakdown-item">
          <div class="breakdown-dot" style="background:${dotColors[i % dotColors.length]}"></div>
          <div class="breakdown-info">
            <div class="breakdown-name">${escHtml(d)}</div>
            <div class="breakdown-count">${n} paper${n > 1 ? 's' : ''}</div>
            <div class="breakdown-bar"><div class="breakdown-fill" style="width:${(n/maxCount)*100}%;background:${dotColors[i % dotColors.length]}"></div></div>
          </div>
        </div>`).join('')}
    </div>`;
  }

  if (view === 'category') {
    const cats = {
      'Universal':      DATA.requirements_for_trustworthy_ai.universal.length,
      'Domain-Specific':DATA.requirements_for_trustworthy_ai.domain_specific.length,
      'Customizable':   DATA.requirements_for_trustworthy_ai.customizable.length,
    };
    const maxCount = Math.max(...Object.values(cats));
    el.innerHTML = `<div class="breakdown-grid">
      ${Object.entries(cats).map(([cat, n], i) => `
        <div class="breakdown-item">
          <div class="breakdown-dot" style="background:${dotColors[i % dotColors.length]}"></div>
          <div class="breakdown-info">
            <div class="breakdown-name">${escHtml(cat)}</div>
            <div class="breakdown-count">${n} rule${n > 1 ? 's' : ''}</div>
            <div class="breakdown-bar"><div class="breakdown-fill" style="width:${(n/maxCount)*100}%;background:${dotColors[i % dotColors.length]}"></div></div>
          </div>
        </div>`).join('')}
    </div>`;
  }

  if (view === 'year') {
    const allRules = [
      ...DATA.requirements_for_trustworthy_ai.universal,
      ...DATA.requirements_for_trustworthy_ai.domain_specific,
      ...DATA.requirements_for_trustworthy_ai.customizable,
    ];
    const yearCounts = {};
    allRules.forEach(r => {
      r.papers.forEach(pid => {
        const paper = DATA.accepted_papers.find(p => p.id === pid);
        if (paper) {
          const y = String(paper.year);
          yearCounts[y] = (yearCounts[y] || new Set());
          yearCounts[y].add(r.rule);
        }
      });
    });
    const yearTotals = Object.fromEntries(Object.entries(yearCounts).map(([y, s]) => [y, s.size]));
    const maxCount = Math.max(...Object.values(yearTotals));
    el.innerHTML = `<div class="breakdown-grid">
      ${Object.entries(yearTotals).sort().map(([y, n], i) => `
        <div class="breakdown-item">
          <div class="breakdown-dot" style="background:${dotColors[i % dotColors.length]}"></div>
          <div class="breakdown-info">
            <div class="breakdown-name">${escHtml(y)}</div>
            <div class="breakdown-count">${n} rule${n > 1 ? 's' : ''}</div>
            <div class="breakdown-bar"><div class="breakdown-fill" style="width:${(n/maxCount)*100}%;background:${dotColors[i % dotColors.length]}"></div></div>
          </div>
        </div>`).join('')}
    </div>`;
  }

}

function wireStatsSubTabs() {
  document.querySelectorAll('.stats-sub-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.stats-sub-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderStatsBreakdown(btn.dataset.view);
    };
  });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

loadData();
</script>
